services:
  nestjs-api:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    command: npm run start:dev
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    environment: &video-env
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: streamtube
      DB_PASSWORD: streamtube
      DB_NAME: streamtube
      JWT_SECRET: ${JWT_SECRET:-development-only-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-development-only-refresh-secret}
      MAIL_HOST: mailpit
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: us-east-1
      S3_BUCKET: streamtube-videos
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-streamtube}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-streamtube-secret}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run worker:dev
    restart: unless-stopped
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
      - video_tmp:/tmp/streamtube-videos
    environment:
      <<: *video-env
      TMPDIR: /tmp/streamtube-videos
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=streamtube
      - POSTGRES_PASSWORD=streamtube
      - POSTGRES_DB=streamtube
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-streamtube}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-streamtube-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${VIDEO_CORS_ORIGIN:-*}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - minio_data:/data

  minio-init:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run storage:init
    depends_on:
      minio:
        condition: service_healthy
    environment: *video-env

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  node_modules:
  postgres_data:
  redis_data:
  minio_data:
  video_tmp:
